name: "Build request"
description: "Request a build"
title: "Build Request (do not edit this)"
body:
  - type: input
    attributes:
      label: "Enter a link to the PR you are requesting a build for"
      placeholder: "https://github.com/yt-dlp/yt-dlp/pull/00000"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: "Advanced: Do you plan to run the builds on a Linux arm32l device (eg Raspberry Pi)"
      options:
        - "No (default, there's a 99% chance you want this option)"
        - "Yes"
      default: 0
